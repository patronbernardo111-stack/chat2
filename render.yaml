services:
  - type: web
    name: egchat-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install --production
    startCommand: node index.firebase.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ALLOWED_ORIGINS
        value: https://egchat-app.vercel.app,https://egchat-v2.vercel.app,http://localhost:3001,http://localhost:5173
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_DATABASE_URL
        value: https://egchat-nativa-default-rtdb.europe-west1.firebasedatabase.app
      - key: FIREBASE_STORAGE_BUCKET
        value: egchat-nativa.appspot.com
